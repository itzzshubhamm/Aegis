version: "2"
sql:
  - schema: "db/migrations/000001_init_schema.up.sql"
    queries: "db/queries/queries.sql"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
